<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CartoM – Édition des données</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/edit.css" />
</head>
<body>
  <header class="edit-header">
    <h1>Édition des données CartoM</h1>
    <p>Clique sur un élément de la carte pour l'éditer, ou sur un endroit vide pour en créer un nouveau.</p>
  </header>

  <div class="edit-layout">
    <div id="map"></div>
    <div class="side-panel">
      <div id="editor-panel" class="editor-panel"></div>
      <div class="export-toolbar">
        <span class="export-label">Exporter :</span>
        <button type="button" data-export="points">points.js</button>
        <button type="button" data-export="rocks">rocks.js</button>
        <button type="button" data-export="landmarks">landmarks.js</button>
        <button type="button" data-export="navlines">navlines.js</button>
      </div>
    </div>
  </div>

  <div id="export-panel" class="export-panel-overlay" hidden>
    <div class="export-actions">
      <button id="copy-btn" type="button">Copier</button>
      <a id="download-link" class="download-btn" download="">Télécharger</a>
      <button id="close-export-btn" type="button">Fermer</button>
    </div>
    <textarea id="export-text" readonly spellcheck="false"></textarea>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/edit.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CartoM – Vision 3D (test) – Rocher d'Oscar</title>
  <meta name="description" content="Test de rendu 3D du fond marin autour du Rocher d'Oscar, à partir des données Litto3D." />
  <meta name="theme-color" content="#0b5566" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/terrain3d.css" />
</head>
<body>
  <header class="app-header">
    <h1><a href="index.html">Vision 3D (test) — Rocher d'Oscar</a></h1>
    <p class="last-update">Relief exagéré x2 · données Litto3D (SHOM), zéro hydrographique</p>
  </header>

  <div id="data-warning" class="data-warning" hidden></div>

  <div id="scene-container">
    <canvas id="scene-canvas"></canvas>
    <div id="scene-loading">Chargement du relief…</div>
    <div id="scene-legend" class="scene-legend" hidden>
      <div class="legend-row elevation-legend-row"><span class="swatch swatch-deep"></span>Fond immergé profond</div>
      <div class="legend-row elevation-legend-row"><span class="swatch swatch-shallow"></span>Fond immergé peu profond</div>
      <div class="legend-row elevation-legend-row"><span class="swatch swatch-intertidal"></span>Estran (marnage)</div>
      <div class="legend-row elevation-legend-row"><span class="swatch swatch-rock"></span>Hors d'eau</div>
      <div class="legend-row water-row"><span class="swatch swatch-water"></span>Marée actuelle : <strong id="scene-tide-height">—</strong></div>
    </div>
    <div id="scene-water-control" class="scene-water-control" hidden>
      <label for="water-slider">Hauteur d'eau simulée : <strong id="water-value">— m</strong></label>
      <input type="range" id="water-slider" min="0" max="12" step="0.1" />
      <button id="water-reset" type="button">↺ Marée actuelle</button>
    </div>
  </div>

  <script type="module" src="js/oscar3d.js"></script>
</body>
</html>
